<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Ký</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <!-- ================= HEADER ================= -->
    <header class="bg-primary text-white text-center py-4">
      <div class="container">
        <h1 class="mb-0">Đăng Ký Tài Khoản</h1>
        <p class="mb-0 text-white-50">
          Vui lòng điền đầy đủ thông tin bên dưới
        </p>
      </div>
    </header>

    <!-- ================= FORM ĐĂNG KÝ ================= -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">Form Đăng Ký</h2>
              <p class="text-muted text-center mb-4">
                Các trường có dấu <span class="text-danger">*</span> là bắt
                buộc.
              </p>

              <form action="#" method="post">
                <!-- Họ và tên -->
                <div class="mb-3">
                  <label for="fullname" class="form-label">
                    Họ và tên <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="fullname"
                    placeholder="Nguyễn Văn A"
                    required
                  />
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label">
                    Email <span class="text-danger">*</span>
                  </label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="example@email.com"
                    required
                  />
                  <div class="form-text">
                    Chúng tôi sẽ không chia sẻ email của bạn.
                  </div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                  <label for="password" class="form-label">
                    Mật khẩu <span class="text-danger">*</span>
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required
                  />
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">
                    Xác nhận mật khẩu <span class="text-danger">*</span>
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    required
                  />
                </div>

                <!-- Giới tính (Radio) -->
                <div class="mb-3">
                  <label class="form-label d-block">Giới tính</label>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="male"
                      value="male"
                      checked
                    />
                    <label class="form-check-label" for="male">Nam</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="female"
                      value="female"
                    />
                    <label class="form-check-label" for="female">Nữ</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="gender"
                      id="other"
                      value="other"
                    />
                    <label class="form-check-label" for="other">Khác</label>
                  </div>
                </div>

                <!-- Sở thích (Checkbox) -->
                <div class="mb-3">
                  <label class="form-label d-block">Sở thích</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobby1"
                      value="doc-sach"
                    />
                    <label class="form-check-label" for="hobby1"
                      >Đọc sách</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobby2"
                      value="the-thao"
                    />
                    <label class="form-check-label" for="hobby2"
                      >Thể thao</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobby3"
                      value="am-nhac"
                    />
                    <label class="form-check-label" for="hobby3">Âm nhạc</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="hobby4"
                      value="du-lich"
                    />
                    <label class="form-check-label" for="hobby4">Du lịch</label>
                  </div>
                </div>

                <!-- Quốc gia (Dropdown Select) -->
                <div class="mb-3">
                  <label for="country" class="form-label">Quốc gia</label>
                  <select class="form-select" id="country">
                    <option selected disabled>-- Chọn quốc gia --</option>
                    <option value="vn">Việt Nam</option>
                    <option value="us">Hoa Kỳ</option>
                    <option value="jp">Nhật Bản</option>
                    <option value="kr">Hàn Quốc</option>
                    <option value="uk">Vương quốc Anh</option>
                    <option value="other">Khác</option>
                  </select>
                </div>

                <!-- Điều khoản -->
                <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="terms"
                    required
                  />
                  <label class="form-check-label" for="terms">
                    Tôi đồng ý với <a href="#">Điều khoản &amp; Chính sách</a>
                  </label>
                </div>

                <!-- Nút Submit -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    Đăng Ký
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Link phụ -->
          <p class="text-center text-muted mt-3">
            Đã có tài khoản? <a href="#">Đăng nhập ngay</a>
          </p>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p class="mb-0">&copy; 2024 MyWebsite. All rights reserved.</p>
    </footer>

    <!-- ================= BOOTSTRAP JS ================= -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
